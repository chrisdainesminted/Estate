    <script>
      // Same theme as the app: onyx unless the person picked light there.
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem('dscr-theme');
        } catch (e) {}
        document.documentElement.classList.toggle('dark', saved !== 'light');
      })();
    </script>
