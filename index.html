    <script>
      // Pick the theme before paint to avoid a flash: the host's explicit
      // choice (data-theme) first, then the in-app toggle, then the OS.
      (function () {
        var root = document.documentElement;
        var host = root.getAttribute('data-theme');
        var saved = null;
        try {
          saved = localStorage.getItem('dscr-theme');
        } catch (e) {}
        var dark = host === 'dark' || host === 'light' ? host === 'dark' : saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        root.classList.toggle('dark', dark);
      })();
    </script>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
