<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found · Squarely</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --page: #fafaf9;
        --ink: #09090b;
        --muted: #52525b;
        --line: #e4e4e7;
        --accent: #047857;
        --accent-ink: #ffffff;
        --mark: #047857;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page: #0b0b0c;
          --ink: #fafafa;
          --muted: #a1a1aa;
          --line: #27272a;
          --accent: #34d399;
          --accent-ink: #052e16;
          --mark: #34d399;
          color-scheme: dark;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        background: var(--page);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        display: flex;
        flex-direction: column;
      }
      header { border-bottom: 1px solid var(--line); }
      .wrap { max-width: 42rem; margin: 0 auto; padding: 0 16px; }
      header .wrap { height: 56px; display: flex; align-items: center; }
      .brand { display: inline-flex; align-items: center; gap: 12px; color: inherit; text-decoration: none; font-weight: 600; font-size: 22px; letter-spacing: -0.02em; }
      .brand svg { width: 32px; height: 32px; }
      main { flex: 1; }
      main .wrap { padding-top: 64px; padding-bottom: 64px; }
      .code { font-size: 13px; font-weight: 600; color: var(--accent); letter-spacing: 0.04em; text-transform: uppercase; margin: 0; }
      h1 { margin: 8px 0 0; font-size: clamp(26px, 5vw, 34px); line-height: 1.15; letter-spacing: -0.02em; }
      p.lede { margin: 12px 0 0; color: var(--muted); font-size: 16px; line-height: 1.55; }
      .links { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 10px; }
      .btn { display: inline-flex; align-items: center; min-height: 40px; padding: 8px 14px; border-radius: 6px; font-size: 14px; font-weight: 500; text-decoration: none; color: var(--ink); border: 1px solid var(--line); }
      .btn:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }
      .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
      .btn.primary:hover { filter: brightness(1.1); background: var(--accent); }
      a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
      footer { border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
      footer .wrap { padding-top: 20px; padding-bottom: 28px; }
      footer a { color: inherit; }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap">
        <a class="brand" href="/" aria-label="Squarely home">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path d="M26 4 L4 4 L4 26 M22 44 L44 44 L44 22" fill="none" stroke="var(--mark)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
            <rect x="15" y="15" width="18" height="18" rx="4" fill="var(--mark)" />
          </svg>
          Squarely
        </a>
      </div>
    </header>
    <main>
      <div class="wrap">
        <p class="code">Page not found</p>
        <h1>We couldn’t find that page</h1>
        <p class="lede">The link may be old or missing a piece. Try one of these instead.</p>
        <div class="links">
          <a class="btn primary" href="/">Go to the homepage</a>
          <a class="btn" href="/app/">Open the calculators</a>
          <a class="btn" href="/homes/">Browse homes</a>
          <a class="btn" href="/contact/">Contact us</a>
        </div>
      </div>
    </main>
    <footer>
      <div class="wrap">Squarely · Estimates, not lending, tax or investment advice. <a href="/privacy/">Privacy</a> · <a href="/terms/">Terms</a></div>
    </footer>
  </body>
</html>
